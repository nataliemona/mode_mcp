[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mode-mcp"
version = "0.1.0"
description = "MCP server for Mode Analytics — browse reports, manage queries, and fetch results"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Natalie Mona Matthews" }]
keywords = ["mcp", "mode", "analytics", "sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "mcp[cli]>=2.3.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.22"]

[project.scripts]
mode-mcp = "mode_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mode_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/mode_mcp", "test_server.py", "README.md", "LICENSE"]
