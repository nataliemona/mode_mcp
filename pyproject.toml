[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mode-mcp"
version = "0.1.0"
description = "MCP server for Mode Analytics — browse reports, manage queries, and fetch results"
requires-python = ">=3.12"
license = "MIT"
keywords = ["mcp", "mode", "analytics", "sql"]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.22"]

[project.scripts]
mode-mcp = "mode_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mode_mcp"]
